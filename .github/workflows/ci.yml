name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install schemaui-cli (form engine)
        run: cargo binstall schemaui-cli --no-confirm

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests (pytest via uv; pwsh e2e runs where available)
        shell: bash
        run: uvx pytest tests/ -v
